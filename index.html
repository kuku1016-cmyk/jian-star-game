<!doctype html><html lang='ko'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>지안이의 별빛 숫자 놀이터</title><style>body{font-family:system-ui;background:#edf5ff;text-align:center;margin:0;padding:12px;color:#193a60}header{background:#173b68;color:white;padding:20px;border-radius:20px}h1{font-size:27px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:15px auto;max-width:750px}button{border:0;border-radius:14px;font-weight:bold;cursor:pointer}.num{min-height:0;height:100%;color:white;font-size:clamp(19px,3.4vh,30px);touch-action:manipulation}.num:nth-child(5n+1){background:#e7b03d}.num:nth-child(5n+2){background:#429ddd}.num:nth-child(5n+3){background:#e56c77}.num:nth-child(5n+4){background:#818a9a}.num:nth-child(5n){background:#4db78a}.selected{outline:5px solid #193b68;outline-offset:-5px}.big{font-size:30px;background:#2777d6;color:white;padding:26px;width:100%;margin-top:15px}.panel{background:white;border-radius:18px;padding:20px;margin:15px auto;max-width:750px}.hide{display:none}.ball{display:inline-grid;place-items:center;border-radius:50%;background:#447db8;color:white;width:44px;height:44px;margin:3px;font-weight:bold}.tab{padding:15px;margin:10px 4px;background:#d5e5fa;color:#193a60}.small{padding:12px;margin:6px;background:#d5e5fa}.item{border-bottom:1px solid #ddd;padding:10px}@media (orientation:portrait){body{padding:5px 8px 8px}header{padding:7px 8px;border-radius:14px}h1{font-size:clamp(18px,2.7vh,24px);margin:4px 0}header p{margin:4px 0;font-size:14px}#picked{min-height:18px;font-size:13px}.tab{padding:8px 12px;margin:5px 3px;font-size:13px}.grid{gap:5px;margin:6px auto;max-width:min(750px,100%);grid-template-rows:repeat(9,minmax(0,1fr));height:calc(100dvh - 230px);min-height:315px;max-height:calc(100svh - 190px)}.num{border-radius:10px}.small{padding:8px 12px;margin:4px}.panel{padding:12px;margin:7px auto}.big{padding:16px;margin-top:8px}}@media (orientation:landscape){.grid{grid-template-rows:repeat(9,minmax(36px,1fr));height:calc(100dvh - 195px);gap:5px}.num{font-size:22px}header{padding:8px}h1{margin:4px}}@supports not (height:100dvh){@media (orientation:portrait){.grid{height:calc(100vh - 230px)}}}</style><header><h1>⭐ 지안이의 별빛 숫자 놀이터 ⭐</h1><p id='msg'>좋아하는 숫자 6개를 눌러봐!</p><div id='picked'></div></header><button class='tab' onclick='tab(false)'>🎮 숫자 놀이</button><button class='tab' onclick='tab(true)'>📊 아빠 기록장</button><section id='play'><div id='grid' class='grid'></div><div id='done' class='panel hide'><h1>🎊 지안아! 최고야! 🎉</h1><p>여섯 개를 모두 골랐어!</p><button class='big' onclick='reset()'>🌈 다시 놀기!</button></div><button class='small' onclick='reset()'>현재 선택 초기화</button></section><section id='records' class='panel hide'><h2>📊 지안이의 숫자 기록</h2><p id='total'></p><h3>많이 고른 숫자 TOP 10</h3><div id='top'></div><h3>선택 히스토리</h3><div id='list'></div><button class='small' onclick='backup()'>CSV 백업</button><p>기록은 이 아이패드에 저장돼요. Safari 데이터 삭제에 대비해 백업해 주세요.</p></section><script>const KEY='jian-history-v1';let selected=[],history=[];try{history=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}const el=id=>document.getElementById(id);for(let n=1;n<=45;n++){let b=document.createElement('button');b.className='num';b.textContent=n;b.onclick=()=>choose(n);el('grid').append(b)}function choose(n){if(selected.length>=6||selected.includes(n))return;selected.push(n);if(selected.length===6){history.push({date:new Date().toISOString(),numbers:[...selected]});try{localStorage.setItem(KEY,JSON.stringify(history))}catch(e){alert('저장 오류: 백업을 확인하세요')}speak('와아! 지안아, 정말 잘했어!')}else speak(String(n));render()}let koreanVoices=[];function loadVoices(){try{koreanVoices=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('ko'));}catch(e){}}loadVoices();if('speechSynthesis'in window)speechSynthesis.addEventListener?.('voiceschanged',loadVoices);function speak(s){try{if(!('speechSynthesis'in window))return;loadVoices();speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='ko-KR';const preferred=['yuna','유나','sora','소라','sunhi','선희','female','여성'];let v=koreanVoices.find(v=>preferred.some(n=>v.name.toLowerCase().includes(n)))||koreanVoices[0];if(v)u.voice=v;u.rate=.86;u.pitch=1.08;u.volume=.92;speechSynthesis.speak(u)}catch(e){}}function render(){el('picked').textContent=selected.join(' ⭐ ');el('grid').classList.toggle('hide',selected.length===6);el('done').classList.toggle('hide',selected.length!==6);el('msg').textContent=selected.length===6?'🎉 지안아! 정말 잘했어!':selected.length+' / 6개 선택';[...el('grid').children].forEach((b,i)=>b.classList.toggle('selected',selected.includes(i+1)))}function reset(){selected=[];render();speak('우리 또 해볼까?')}function tab(record){el('play').classList.toggle('hide',record);el('records').classList.toggle('hide',!record);if(record)stats()}function stats(){el('total').textContent='총 '+history.length+'게임';let count=Array(46).fill(0);history.forEach(h=>h.numbers.forEach(n=>count[n]++));el('top').replaceChildren();Array.from({length:45},(_,i)=>i+1).sort((a,b)=>count[b]-count[a]||a-b).filter(n=>count[n]).slice(0,10).forEach(n=>{let p=document.createElement('p');p.textContent=n+'번 — '+count[n]+'회';el('top').append(p)});el('list').replaceChildren();history.slice().reverse().forEach((h,i)=>{let p=document.createElement('div');p.className='item';p.textContent=(history.length-i)+'회 · '+new Date(h.date).toLocaleString('ko-KR')+' · '+h.numbers.join(', ');el('list').append(p)})}function backup(){let s='\ufeff날짜,선택1,선택2,선택3,선택4,선택5,선택6\n'+history.map(h=>[h.date,...h.numbers].join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download='jian-history.csv';a.click()}render()</script></html>
